apply plugin: 'com.android.application'

android {
    namespace 'com.jnetai.appstore'
    compileSdk 34

    signingConfigs {
        release {
            storeFile file("${rootDir}/jnet-app-store-keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "jnetappstore"
            keyAlias System.getenv("KEY_ALIAS") ?: "appstore"
            keyPassword System.getenv("KEY_PASSWORD") ?: "jnetappstore"
        }
    }

    defaultConfig {
        applicationId "com.jnetai.appstore"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        resValue "string", "store_base_url", "https://apps.jnetai.com"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
